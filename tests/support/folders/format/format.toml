# A format of the tests that names a team by its manifest, as a course's format does.
contract = 1
requires = ">=0.1"
name = "Namer"
version = "1"
script = "format.py"
summary = "Reads manifest.json for the name and the players of a team, and refuses a team without one."

[process]
threads = 1
match_minutes = 60

[options.crash]
type = "bool"
default = false
label = "Crash"
reaches = "check"

[options.matches]
type = "int"
default = 0
range = [0, 400]
label = "Steps of a check match"
reaches = "check"

[options.tag]
type = "text"
default = ""
max_length = 20
label = "Tag"

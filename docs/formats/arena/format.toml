# The Arena 5 vs 5 format, an example for the guide on writing a format. It is added by a person
# and ships as no built-in format. Every limit below is this format's own choice, so a competition
# that wants other limits changes the numbers in this file.
contract = 1
requires = ">=0.1.0"
name = "Arena 5 vs 5"
version = "1"
script = "format.py"
summary = "An agent.py with a class Agent and a manifest.yml, five time limits and one thread, on 5 vs 5."

[process]
threads = 1
gpu = "never"
# A side that takes more than this over a match forfeits as ceiling.time. The options below allow
# 300 s for a first call and 1.1 s for each later call, which comes to 3599 s over 3000 steps, so
# the mean limit and the call limits always decide a slow side before this ceiling does.
match_minutes = 60
check_minutes = 90

[results]
forfeit_score = [0, 3]

[options.load_seconds]
label = "Loading"
type = "float"
default = 30
range = [1, 600]
unit = "s"

[options.first_call_seconds]
bounds = "step"
label = "First call"
type = "float"
default = 10
range = [0.1, 300]
unit = "s"

[options.call_seconds]
bounds = "step"
label = "Each later call"
type = "float"
default = 1
range = [0.01, 1.1]
unit = "s"

[options.mean_ms]
label = "Mean call"
type = "float"
default = 20
range = [0.1, 1000]
unit = "ms"

[options.reset_seconds]
label = "Reset"
type = "float"
default = 5
range = [0.1, 300]
unit = "s"

[options.folder_mib]
label = "Folder"
type = "float"
default = 100
range = [1, 500]
unit = "MiB"

# Off as the arena plays. On, the agent's random, numpy and torch generators start from the
# match's seed, so a match played again from its seed gives the same actions.
[options.seed_globals]
label = "Seed generators"
type = "bool"
default = false

# Reaches only the pre-check, so it never joins a model's identity.
[options.check_matches]
label = "Check matches"
type = "int"
default = 1
range = [1, 3]
reaches = "check"

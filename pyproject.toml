[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cuju-arena"
dynamic = ["version"]
description = "Play, judge, record and run tournaments for Cuju football"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "André Koraleski" }]
keywords = ["cuju", "football", "google-research-football", "tournaments", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = ["cuju-engine>=0.3.0,<0.4", "tomli>=2; python_version < '3.11'", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/cuju-football/arena"
Documentation = "https://github.com/cuju-football/arena/tree/main/docs"
Source = "https://github.com/cuju-football/arena"
Issues = "https://github.com/cuju-football/arena/issues"
Changelog = "https://github.com/cuju-football/arena/blob/main/CHANGELOG.md"

[project.entry-points."cuju.commands"]
arena = "cuju.arena.__main__:main"

[project.entry-points."cuju.arena.plugins"]
builtin = "cuju.arena._builtin_plugins"

[tool.hatch.version]
path = "src/cuju/arena/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cuju"]

[tool.hatch.build.targets.sdist]
include = [
    "/ci/sdist.py",
    "/src",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "ci/sdist.py"

[tool.ruff]
line-length = 100
# `cuju` and the shared fixtures of `tests` import as first-party code.
src = ["src", "tests"]
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cuju", "conftest", "support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
